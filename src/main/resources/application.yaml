spring:
  application:
    name: iot-timeseries-collector
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:/db/changelog/changelog-master.yaml
    default-schema: core
    liquibase-schema: core